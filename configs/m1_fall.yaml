# ─────────────────────────────────────────────────────────────────────────────
# SafeWave-AI  M1 (fall detection)  —  training config
# Hard contracts (NEVER change) are flagged. Everything else is tunable.
# ─────────────────────────────────────────────────────────────────────────────

tensor:
  # HARD CONTRACT — rp5 db_spec_v2 §7. Input is (B,5,64,100): 5 nodes stacked on
  # the conv input-channel axis × 64 subcarriers × 100 frames (1 s @ 100 Hz).
  # Nodes are NEVER concatenated on the subcarrier axis (legacy 192 forbidden).
  n_channels: 64          # FIXED — subcarriers stay 64
  window_frames: 100      # FIXED (1 s @ sample_rate_hz)
  sample_rate_hz: 100     # FIXED — frame cadence of the raw stream
  n_nodes: 3              # node axis = conv input channels (early fusion)

  # Guard / null subcarriers: always 0, kept in-place (shape stays 64, not 52).
  guard_indices: [0, 1, 2, 3, 4, 5, 32, 59, 60, 61, 62, 63]

normalize:
  # ESP does per-frame peak normalization (max=1.0) before data_raw reaches the
  # model, so training data is normalized the same way for parity.
  # Per frame: divide the 64-vector by max(|frame|) over non-guard channels.
  # Absolute-amplitude reconstruction is FORBIDDEN — only relative channel
  # pattern + temporal change is learned.
  mode: per_frame_peak    # {per_frame_peak}
  eps: 1.0e-6             # guards against all-zero frames

window:
  stride_frames: 50       # 75% overlap between consecutive windows (dense coverage)
  # Optional denser sampling around fall instants (rare class). null → use stride_frames.
  fall_stride_frames: 20
  drop_last_partial: true # discard a trailing window shorter than window_frames

label:
  task: binary            # {binary, multiclass} — binary (fall / non-fall) recommended
  fall_halfwidth_ms: 1000 # positive interval = [t_fall ± this]  (±1 s)
  fall_pos_frac: 0.5      # window is positive if ≥ this fraction of its frames are in a positive interval

split:
  by: session             # split unit = session/file (prevents same-session leakage)
  val_frac: 0.2           # of sessions without an explicit `split` override
  test_frac: 0.0
  seed: 1337

imbalance:
  # Fall windows are rare. Pick ONE strategy (loader/trainer honor this).
  strategy: weighted_sampler   # {weighted_sampler, focal_loss, none}
  focal_gamma: 2.0             # used only when strategy == focal_loss
  pos_weight: null             # BCEWithLogits pos_weight; null → auto from class counts

model:
  # CNN-GRU. Small enough for RPi5 CPU inference (target < a few ms).
  conv_channels: [16, 32, 64]
  gru_hidden: 64
  gru_layers: 1
  dropout: 0.5

train:
  epochs: 40
  batch_size: 64
  lr: 3.0e-4
  weight_decay: 1.0e-4
  early_stop_patience: 8       # on val fall-recall (primary metric)
  primary_metric: pr_auc  # missed falls are the costly error
  report_metrics: [fall_recall, pr_auc, precision, f1]

# NO pretrain block — the 5-node model trains from scratch.
# runs/best_B2_final.pt is single-node (conv1 expects 1 input channel); loading it
# into a 5-channel model fails strict=True by design. Do NOT re-add it here.
# (`--init-ckpt PATH` remains available once a 5-node checkpoint exists.)

paths:
  raw_dir: data/raw_main
  labels_csv: data/labels_split.csv
  cache_dir: data/windows_cache
  out_dir: runs

export:
  # HARD CONTRACT — rp5 ONNX I/O contract.
  opset: 17
  input_name: csi_data         # rp5 _infer_onnx feed name
  output_name: fall_logit      # pre-sigmoid logit, shape (B,1); rp5 else-branch reads reshape(-1)[0]
  onnx_path: runs/m1_wifi_pose.onnx
