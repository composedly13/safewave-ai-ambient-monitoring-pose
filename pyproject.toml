[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safewave-m1-train"
version = "0.0.1"
description = "SafeWave-AI M1 fall-detection training pipeline (CSI -> CNN-GRU -> ONNX)"
requires-python = ">=3.9"
dynamic = ["dependencies"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
